<style>
:root{
  --bg:#fbf6ee; --paper:#fffdf9; --ink:#14213d; --ink-2:#4a5470; --muted:#8a90a2;
  --line:#ece3d4; --accent:#f26b1d; --accent-soft:#fde8da;
  --sev-critical:#b42318; --sev-high:#e8590c; --sev-medium:#c98a04; --sev-low:#5c7cfa;
  --pass:#2f9e44; --gap:#e8590c; --unknown:#9aa0ae; --na:#d6d1c7;
  --code-bg:#f4ede1; --shadow:0 1px 2px rgba(20,33,61,.06),0 6px 20px rgba(20,33,61,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11141b; --paper:#191d27; --ink:#eef0f5; --ink-2:#b9bfcd; --muted:#868d9e;
    --line:#2a3040; --accent:#ff8a3d; --accent-soft:#3a2416;
    --sev-critical:#ff6b5e; --sev-high:#ff8a3d; --sev-medium:#f2c14e; --sev-low:#8fa8ff;
    --pass:#5fd07a; --gap:#ff8a3d; --unknown:#7d8496; --na:#3a4052;
    --code-bg:#222838; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:40px 20px 64px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
a{color:var(--accent)}
/* header */
.hero{position:relative;background:var(--paper);border-radius:20px;padding:28px 28px 24px;box-shadow:var(--shadow);overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--accent-soft)}
.kicker{position:relative;display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:700;font-size:14px;letter-spacing:.02em}
.kicker:before{content:"";width:22px;height:3px;border-radius:2px;background:var(--accent)}
h1{position:relative;margin:10px 0 14px;font-size:30px;line-height:1.25;letter-spacing:-.01em;word-break:break-word}
.chips{position:relative;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.chip.ro{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
/* summary */
.summary{margin-top:18px;background:var(--ink);color:#fff;border-radius:18px;padding:22px 24px;box-shadow:var(--shadow)}
@media (prefers-color-scheme: dark){.summary{background:#252c3d}}
.summary h2{margin:0 0 10px;font-size:15px;color:#ffd2b5;font-weight:700}
.summary ol{margin:0;padding:0;list-style:none;counter-reset:s}
.summary li{position:relative;padding:5px 0 5px 30px;font-size:17px;line-height:1.6}
.summary li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sevbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sevpill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
/* sections */
section{margin-top:34px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.sec-h .n{font-size:13px;font-weight:700;color:var(--accent);font-family:ui-monospace,Menlo,monospace}
.sec-h h2{margin:0;font-size:21px}
.card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px}
.lines{margin:0;padding:0;list-style:none}
.lines li{padding:7px 0;border-bottom:1px dashed var(--line);color:var(--ink-2)}
.lines li:last-child{border-bottom:0}
/* layers */
.layers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.layer{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.layer .ln{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.layer .ln .num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.layer p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.6}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.counts{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--ink-2)}
.counts b{color:var(--ink);font-variant-numeric:tabular-nums}
.gaprules{font-size:12.5px;color:var(--muted)}
/* paths */
.path{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);color:var(--ink-2)}
.path:last-child{border-bottom:0}
.path .tag{flex:none;margin-top:3px;font-size:12px;padding:1px 8px;border-radius:999px;color:#fff;font-weight:600}
/* findings */
.finding{position:relative;background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px 16px 24px;margin-bottom:14px;overflow:hidden}
.finding:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sev)}
.f-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.fid{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);font-weight:700}
.sev{font-size:12.5px;font-weight:700;color:#fff;background:var(--sev);padding:1px 9px;border-radius:999px}
.lay{font-size:12.5px;color:var(--ink-2);background:var(--bg);border:1px solid var(--line);padding:0 8px;border-radius:999px}
.finding h3{margin:0 0 10px;font-size:18px;line-height:1.45}
.row{display:grid;grid-template-columns:92px 1fr;gap:4px 12px;padding:6px 0;border-top:1px dashed var(--line);font-size:15px}
.row .k{color:var(--muted);font-size:13.5px;padding-top:2px}
.row .v{color:var(--ink)}
.loc{display:inline-block;background:var(--code-bg);border-radius:6px;padding:0 6px;margin:0 4px 4px 0;font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all}
.f-foot{margin-top:8px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
details{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
details .row{grid-template-columns:120px 1fr}
/* table */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.verdict{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;color:#fff;white-space:nowrap}
/* next */
.next{margin:0;padding:0;list-style:none;counter-reset:n}
.next li{position:relative;padding:10px 0 10px 40px;border-bottom:1px dashed var(--line)}
.next li:last-child{border-bottom:0}
.next li:before{counter-increment:n;content:counter(n);position:absolute;left:0;top:9px;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center}
.empty{color:var(--muted);font-style:italic}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
footer strong{color:var(--ink-2)}
.err{background:#fff3f0;color:#b42318;border:1px solid #f4c7bd;padding:16px;border-radius:12px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap}
@media (max-width:640px){
  .wrap{padding:20px 16px 48px}
  h1{font-size:24px}
  .layers{grid-template-columns:1fr}
  .row,details .row{grid-template-columns:1fr}
  .summary li{font-size:16px}
}
@media print{
  body{background:#fff}
  .hero,.card,.layer,.finding{box-shadow:none;border:1px solid #ddd}
  .finding{break-inside:avoid}
  details{display:block}
}
</style>
